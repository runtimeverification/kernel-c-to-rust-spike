[package]
name = "uvc_verify"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"

# Self-contained Charon/Aeneas extraction target: a verbatim copy of the
# faithful UVC parse leaf (rust/src/lib.rs), as a plain rlib. Kept self-
# contained (no cdylib dependency) because Charon cannot link the shipping
# crate's cdylib crate-type. Default features only — NOT the `vuln` control.
[lib]
path = "src/lib.rs"

